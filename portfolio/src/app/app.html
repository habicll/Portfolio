<app-navbar></app-navbar>

<!-- Left Sidebar Navigation -->
<aside class="sidebar" [class.sidebar-visible]="showSidebar">
  <nav class="sidebar-nav">
    <a routerLink="/" class="sidebar-icon" [class.active]="activeSection === 'home'"
       (mouseenter)="sidebarTooltip = 'HOME'" (mouseleave)="sidebarTooltip = ''">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <span class="sidebar-label">HOME</span>
    </a>
    <a routerLink="/projects" class="sidebar-icon" [class.active]="activeSection === 'projects'"
       (mouseenter)="sidebarTooltip = 'PROJECTS'" (mouseleave)="sidebarTooltip = ''">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <span class="sidebar-label">PROJECTS</span>
    </a>
    <a routerLink="/timeline" class="sidebar-icon" [class.active]="activeSection === 'timeline'"
       (mouseenter)="sidebarTooltip = 'TIMELINE'" (mouseleave)="sidebarTooltip = ''">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="sidebar-label">TIMELINE</span>
    </a>
    <a routerLink="/contact" class="sidebar-icon" [class.active]="activeSection === 'contact'"
       (mouseenter)="sidebarTooltip = 'CONTACT'" (mouseleave)="sidebarTooltip = ''">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <span class="sidebar-label">CONTACT</span>
    </a>
  </nav>
</aside>

<main class="main-content">

</main>
