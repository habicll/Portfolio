<header class="navbar" [class.navbar-scrolled]="isScrolled">
  <div class="navbar-inner">
    <!-- Brand -->
    <a routerLink="/" class="navbar-brand" (click)="closeMenu()">
      <span class="brand-text">Habi Cailleau</span>
    </a>

    <!-- Desktop Nav -->
    <nav class="navbar-links">
      <a routerLink="/projects" routerLinkActive="active-link" class="nav-link">{{ i18n.t().nav.projects }}</a>
      <a routerLink="/about" routerLinkActive="active-link" class="nav-link">{{ i18n.t().nav.skills }}</a>
      <a routerLink="/contact" routerLinkActive="active-link" class="nav-link">{{ i18n.t().nav.contact }}</a>
    </nav>

    <!-- Language Toggle + Hamburger -->
    <div class="navbar-actions">
      <button class="lang-toggle" (click)="i18n.toggleLang()" [attr.aria-label]="'Switch to ' + (i18n.lang() === 'en' ? 'French' : 'English')">
        <span class="lang-option" [class.lang-active]="i18n.lang() === 'en'">EN</span>
        <span class="lang-divider">/</span>
        <span class="lang-option" [class.lang-active]="i18n.lang() === 'fr'">FR</span>
      </button>

      <!-- Mobile Hamburger -->
      <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle menu" [class.is-open]="isMenuOpen()">
        <span class="hamburger-line line-1"></span>
        <span class="hamburger-line line-2"></span>
        <span class="hamburger-line line-3"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <nav class="mobile-menu" *ngIf="isMenuOpen()">
    <a routerLink="/" class="mobile-link" (click)="closeMenu()">{{ i18n.t().nav.home }}</a>
    <a routerLink="/projects" routerLinkActive="active-link" class="mobile-link" (click)="closeMenu()">{{ i18n.t().nav.projects }}</a>
    <a routerLink="/about" routerLinkActive="active-link" class="mobile-link" (click)="closeMenu()">{{ i18n.t().nav.skills }}</a>
    <a routerLink="/contact" routerLinkActive="active-link" class="mobile-link" (click)="closeMenu()">{{ i18n.t().nav.contact }}</a>
  </nav>
</header>
