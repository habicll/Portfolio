<!-- ===== CONTACT PAGE ===== -->
<section class="contact-page">
  <!-- Status widget -->
  <div class="contact-status reveal">
    <span class="status-line">STATUS: AWAITING_INPUT</span>
    <span class="status-line">LOC: 47.2184_N_1.5536_W</span>
    <span class="status-line">CHANNEL: OPEN</span>
  </div>

  <div class="contact-content">
    <div class="contact-header reveal">
      <h1 class="contact-heading">
        {{ i18n.t().contact.heading1 }}
        <span class="text-gold-italic">{{ i18n.t().contact.heading2 }}</span>
      </h1>
      <p class="contact-subtitle">{{ i18n.t().contact.subtitle }}</p>
    </div>

    <form class="contact-form reveal" (ngSubmit)="sendMessage()">
      <div class="form-row">
        <div class="form-field">
          <label class="form-label">{{ i18n.t().contact.labelName }}</label>
          <input type="text" class="form-input" [placeholder]="i18n.t().contact.placeholderName"
                 [(ngModel)]="formData.name" name="name" required />
        </div>
        <div class="form-field">
          <label class="form-label">{{ i18n.t().contact.labelEmail }}</label>
          <input type="email" class="form-input" [placeholder]="i18n.t().contact.placeholderEmail"
                 [(ngModel)]="formData.email" name="email" required />
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">{{ i18n.t().contact.labelMessage }}</label>
        <textarea class="form-input form-textarea" [placeholder]="i18n.t().contact.placeholderMessage"
                  [(ngModel)]="formData.message" name="message" required></textarea>
      </div>

      <div class="contact-actions">
        <button type="submit" class="btn-gold" [disabled]="isSending">
          {{ isSending ? i18n.t().contact.btnSending : (isSent ? i18n.t().contact.btnSent : i18n.t().contact.btnSend) }}
          <svg *ngIf="!isSending && !isSent" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>

        <a href="Habi%20CAILLEAU%20CV%20Alt.pdf" target="_blank" class="btn-outline resume-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          {{ i18n.t().contact.downloadResume }}
        </a>

        <div class="contact-social">
          <a href="https://github.com/habicll" target="_blank" class="social-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
            </svg>
            GITHUB
          </a>
          <a href="https://www.linkedin.com/in/habi-cailleau-3b72b5293" target="_blank" class="social-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
              <rect x="2" y="9" width="4" height="12"/>
              <circle cx="4" cy="4" r="2"/>
            </svg>
            LINKEDIN
          </a>
        </div>
      </div>
    </form>
  </div>

  <!-- Decorative H watermark -->
  <div class="contact-watermark">H</div>
</section>
