<section class="contact-hero">
  <div class="contact-hero-bg"></div>

  <div class="contact-inner">
    <!-- Left Column -->
    <div class="contact-left">
      <h1 class="contact-heading reveal-contact">
        {{ i18n.t().contact.heading1 }}<br/>
        <span class="gradient-text-cyan">{{ i18n.t().contact.heading2 }}</span>
      </h1>
      <div class="typing-line reveal-contact">
        <span class="typing-prefix">&gt;</span>
        <span class="typing-text">{{ typedText }}</span>
        <span class="typing-cursor" [class.blink-off]="!showCursor">_</span>
      </div>
      <p class="contact-subtitle reveal-contact">
        {{ i18n.t().contact.subtitle }}
      </p>

      <!-- Resume Card -->
      <div class="resume-card reveal-contact">
        <div class="resume-info">
          <span class="resume-label">{{ i18n.t().contact.resumeLabel }}</span>
          <span class="resume-title">{{ i18n.t().contact.resumeTitle }}</span>
        </div>
        <a href="Habi%20CAILLEAU%20CV%20Alt.pdf" target="_blank" class="resume-download" title="Download Resume">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </a>
      </div>

      <!-- Social Links -->
      <div class="social-links reveal-contact">
        <a href="https://www.linkedin.com/in/habi-cailleau-3b72b5293" target="_blank" rel="noopener noreferrer" class="social-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          LINKEDIN
        </a>
        <a href="https://github.com/habicll" target="_blank" rel="noopener noreferrer" class="social-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          GITHUB
        </a>
      </div>

      <!-- Network Status Widget with Canvas -->
      <div class="network-widget reveal-contact">
        <div class="network-visual">
          <canvas #networkCanvas class="network-canvas"></canvas>
        </div>
        <div class="network-info">
          <span class="network-label">{{ i18n.t().contact.networkLabel }}</span>
          <span class="network-value">
            <span class="network-dot-green"></span>
            {{ i18n.t().contact.networkValue }}
          </span>
        </div>
      </div>
    </div>

    <!-- Right Column - Form -->
    <div class="contact-right reveal-contact">
      <div class="contact-form-card">
        <form class="contact-form" (ngSubmit)="sendMessage()" #contactForm="ngForm" autocomplete="off">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">{{ i18n.t().contact.labelName }}</label>
              <input type="text" name="name" [(ngModel)]="formData.name" required
                     [placeholder]="i18n.t().contact.placeholderName" class="form-input" />
            </div>
            <div class="form-group">
              <label class="form-label">{{ i18n.t().contact.labelEmail }}</label>
              <input type="email" name="email" [(ngModel)]="formData.email" required
                     [placeholder]="i18n.t().contact.placeholderEmail" class="form-input" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">{{ i18n.t().contact.labelObjective }}</label>
            <div class="select-wrapper">
              <select name="objective" [(ngModel)]="formData.objective" class="form-select">
                <option value="collaboration">{{ i18n.t().contact.optCollab }}</option>
                <option value="freelance">{{ i18n.t().contact.optFreelance }}</option>
                <option value="fulltime">{{ i18n.t().contact.optFulltime }}</option>
                <option value="other">{{ i18n.t().contact.optOther }}</option>
              </select>
              <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">{{ i18n.t().contact.labelMessage }}</label>
            <textarea name="message" [(ngModel)]="formData.message" required rows="5"
                      [placeholder]="i18n.t().contact.placeholderMessage" class="form-textarea"></textarea>
          </div>

          <button type="submit" class="submit-btn" [disabled]="!contactForm.form.valid || isSending">
            <span *ngIf="!isSending && !isSent">{{ i18n.t().contact.btnSend }}</span>
            <span *ngIf="isSending">{{ i18n.t().contact.btnSending }}</span>
            <span *ngIf="isSent">{{ i18n.t().contact.btnSent }}</span>
            <svg *ngIf="!isSending && !isSent" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
